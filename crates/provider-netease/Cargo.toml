[package]
name = "dsls-provider-netease"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# ⚠️ 这里**刻意没有 `anyhow`**：**音源层（`provider-*`）对外一律是 typed
# `SourceError`**（设计文档 §4.5）—— 音源抽象是**第三方实现要绑上去的边界**，
# 错误类型必须可穷尽匹配；`anyhow::Error` 是不透明类型，与这条约束方向相反。
# 作为一条声明了的依赖它就是一条活隐患：任何人往这个 crate 里写
# `use anyhow::Result` 都没有工具会报错。
#
# ⚠️ 这条约束的范围**只有 `provider-*`**，**不是**「`anyhow` 只允许出现在 `app`
# 的边界」（那句话是假的）。`crates/platform` 一直在用 `anyhow`，而且**是有意的**：
# 平台层面向 app 内部，不是别人要实现的抽象。**不要去「修」它。**
dsls-provider-api = { path = "../provider-api" }
# 已核实：全 crate 只有 0.1.0 一个发布版本（2026-04-07，作者 imsyy/SPlayer）。
# 保持 "0.1"（= ^0.1 = >=0.1.0,<0.2.0）而不是 =0.1.0：
#   (a) semver 下 0.2 本来就不会被自动选中，破坏性升级不会悄悄进来；
#   (b) =0.1.0 会把后续 0.1.x 的修 bug 版本也一起挡在门外；
#   (c) 真正的防线是提交进仓库的 Cargo.lock。
# 单版本 crate 的长期风险是真的 —— 缓解手段是把它整个包在我们自己的
# NeteaseClient 后面（本任务就是这么做的），换实现时改动能收敛在这里。
ncm-api-rs = "0.1"
# ⚠️ **刻意没有 `tokio`** —— 它在 `src/` 里**零引用**
#（本 crate 只做扫码登录，是同步的；异步在 `app` 的边界）。
# 计划里那句「Task 7/8 的伏笔」**已经过期**：那两个任务都已经落地，
# 而它们也没用上它。**这是本项目第三次「声明了但零使用」**
#（前两次：Task 6 的 `anyhow`、Task 8 的 `reqwest`+`tokio`）。
# ⇒ **§18.10 依赖裁剪**：写完依赖表要回头看谁真的用了。
async-trait = "0.1"
log.workspace = true
serde_json = "1"
qrcode = { version = "0.14.1", features = ["image"] }
# ⚠️ **必须关掉默认 feature。** `image` 的 default-formats 含 `avif`（走
# `ravif` 纯 Rust AV1 编码器），而我们只用 `ImageFormat::Png` 这一个编解码器。
# 实测本 crate 的依赖树：默认 feature 下 227 个唯一 crate（`ravif` / `avif-serialize`
# 在树里），关掉后 164 个，两者都不在。详见 Task 6 报告「修复轮」。
# （`png` feature 同时含编码与解码，够 `write_to` 与测试里的 `load_from_memory_with_format` 用。）
image = { version = "0.25.9", default-features = false, features = ["png"] }
